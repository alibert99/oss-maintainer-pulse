name: Bug report
description: Report incorrect queueing, scoring, fetching, or rendering behavior.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, input shape, and output you saw.
      placeholder: maintainer-pulse owner/repo --input issues.json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: maintainer-pulse 0.1.0

