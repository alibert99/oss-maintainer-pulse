[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-maintainer-pulse"
version = "0.1.3"
description = "Offline-first GitHub issue and pull request health reports for open-source maintainers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Maintainer Pulse contributors" }
]
keywords = ["open-source", "github", "maintenance", "triage", "release"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alibert99/oss-maintainer-pulse"
Repository = "https://github.com/alibert99/oss-maintainer-pulse"
Issues = "https://github.com/alibert99/oss-maintainer-pulse/issues"
Documentation = "https://github.com/alibert99/oss-maintainer-pulse#readme"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.5",
  "twine>=5",
]

[project.scripts]
maintainer-pulse = "maintainer_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
